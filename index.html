const RACES=[{name:'Boom+ Half Marathon',date:'2026-09-13',kind:'Controlled rehearsal'},{name:'Jakarta Run Fest Marathon',date:'2026-10-25',kind:'Controlled dress rehearsal'},{name:'Bintaro Loop Ultra 60K',date:'2027-05-07',kind:'Primary goal'}];
const KEY='bintaro60k_v1';
let state=load();
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s)return {...defaults(),...s}}catch(e){}return defaults()}
function defaults(){return {logs:{},checkpoints:Object.fromEntries(BASE.checkpoints),viewFilter:'upcoming'}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast('Saved')}
function today(){let d=new Date(); return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
let lastKnownDate=today();
function refreshForDateChange(){const now=today();if(now!==lastKnownDate){lastKnownDate=now;renderAll();toast('Today updated')}}
function dparse(s){return new Date(s+'T12:00:00')}
function fmtDate(s,opt={weekday:'short',day:'numeric',month:'short'}){return dparse(s).toLocaleDateString(undefined,opt)}
function paceToSec(v){if(v===null||v===undefined||v==='')return null; let n=Number(v);if(!Number.isFinite(n))return null;let m=Math.floor(n), ss=Math.round((n-m)*100);if(ss>=60)return null;return m*60+ss}
function secToPace(sec){if(sec===null||!Number.isFinite(sec))return '—';sec=Math.round(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function secToMMSSNumber(sec){sec=Math.round(sec/5)*5;return Number((Math.floor(sec/60)+((sec%60)/100)).toFixed(2))}
function checkpointFor(date){let cps=Object.entries(state.checkpoints).sort((a,b)=>a[0].localeCompare(b[0]));let val=cps[0][1];for(let [d,v] of cps){if(d<=date)val=Number(v)}return Number(val)}
function targetPace(w){if(w.type==='REST')return '—';let mid=paceToSec(checkpointFor(w.date));if(['EASY','LONG RUN'].includes(w.type))return secToPace(mid-15)+'–'+secToPace(mid+15)+'/km';if(w.type==='THRESHOLD')return secToPace(mid-100)+'–'+secToPace(mid-85)+'/km';if(w.type==='TEMPO'){if((w.session||'').toLowerCase().includes('ultra goal pace'))return secToPace(mid-75)+'/km';return secToPace(mid-75)+'–'+secToPace(mid-60)+'/km'}if(w.type==='DRESS REH.'){if((w.session||'').toUpperCase().includes('BOOM'))return 'HM race pace +15–20 sec/km';return secToPace(mid-75)+'/km'}if(w.type==='RACE DAY')return secToPace(mid-75)+'/km avg';return '—'}
function estTime(w){if(!w.km||w.type==='REST'||(w.session||'').toUpperCase().includes('BOOM'))return '—';let mid=paceToSec(checkpointFor(w.date)),p;if(['EASY','LONG RUN'].includes(w.type))p=mid;else if(w.type==='THRESHOLD')p=mid-92.5;else if(w.type==='TEMPO')p=mid-67.5;else p=mid-75;let s=w.km*p;return dur(s)}
function dur(s){s=Math.round(s);let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`}
function dayDiff(a,b){return Math.ceil((dparse(b)-dparse(a))/86400000)}
function currentWorkout(){return BASE.plan.find(x=>x.date===today())}
function weeklyKm(date=today()){let d=dparse(date),dow=(d.getDay()+6)%7;let mon=new Date(d);mon.setDate(d.getDate()-dow);let sun=new Date(mon);sun.setDate(mon.getDate()+6);return BASE.plan.filter(w=>{let x=dparse(w.date);return x>=mon&&x<=sun}).reduce((a,w)=>a+(Number(w.km)||0),0)}
function qualifyingEasy(){let cutoff=dparse(today());cutoff.setDate(cutoff.getDate()-28);return Object.entries(state.logs).map(([date,l])=>({date,...l})).filter(l=>dparse(l.date)>=cutoff&&dparse(l.date)<=dparse(today())&&l.type==='EASY'&&l.completed==='Yes'&&Number(l.actualKm)>=3&&paceToSec(l.actualPace)!=null&&Number(l.rpe)<=4)}
function trend(){let q=qualifyingEasy();if(!q.length)return null;return q.reduce((a,l)=>a+paceToSec(l.actualPace),0)/q.length}
function nextRace(){return RACES.find(r=>r.date>=today())||RACES[RACES.length-1]}
function renderHome(){let w=currentWorkout(), q=qualifyingEasy(), tr=trend(), mid=checkpointFor(today()), sug=tr==null?null:secToMMSSNumber(tr), status=q.length<3?'Log 3+ easy runs first':Math.abs(paceToSec(mid)-paceToSec(sug))>=5?'Review easy midpoint':'On track', nr=nextRace();
let hero=w?`<div class="eyebrow">${w.type}</div><h1>${w.session}</h1><div class="muted">${fmtDate(w.date,{weekday:'long',day:'numeric',month:'long'})} · ${w.phase}</div><div class="hero-meta"><div class="mini">Distance<b>${w.km} km</b></div><div class="mini">Target pace<b>${targetPace(w)}</b></div><div class="mini">Est. time<b>${estTime(w)}</b></div><div class="mini">This week<b>${weeklyKm()} km</b></div></div>`:`<div class="eyebrow">Today</div><h1>No workout scheduled</h1>`;
document.querySelector('#home').innerHTML=`<div class="hero">${hero}</div><div class="section-title"><h2>Easy pace check</h2><span class="muted">Last 28 days</span></div><div class="card"><div class="grid3"><div class="stat"><small>Current</small><b>${secToPace(paceToSec(mid))}/km</b></div><div class="stat"><small>Trend</small><b>${tr?secToPace(tr)+'/km':'—'}</b></div><div class="stat"><small>Runs</small><b>${q.length}</b></div></div><div class="row"><span>Status</span><span class="value ${status==='On track'?'good':status.startsWith('Review')?'warning':''}">${status}</span></div>${sug?`<div class="row"><span>Suggested midpoint</span><span class="value">${secToPace(paceToSec(sug))}/km</span></div>`:''}</div><button class="btn full" onclick="goLog()">Log today's run</button><div class="section-title"><h2>Race countdowns</h2></div>${RACES.map(r=>`<div class="card race"><div><b>${r.name}</b><div class="muted">${r.kind} · ${fmtDate(r.date,{day:'numeric',month:'short',year:'numeric'})}</div></div><div class="days">${Math.max(0,dayDiff(today(),r.date))}d</div></div>`).join('')}<div class="card"><b>Training rule</b><div class="note">On easy and long-run days, choose comfortable conversational effort over forcing the fast end of the range. Heavy legs, pain, illness or poor recovery override the plan.</div></div>`}
function renderPlan(){let filter=state.viewFilter, items=BASE.plan.filter(w=>filter==='all'||w.date>=today()).slice(0,filter==='upcoming'?42:999);document.querySelector('#plan').innerHTML=`<div class="section-title"><h2>Training plan</h2><span class="muted">${BASE.plan.length} days</span></div><div class="switches"><button class="chip ${filter==='upcoming'?'active':''}" onclick="setFilter('upcoming')">Next 6 weeks</button><button class="chip ${filter==='all'?'active':''}" onclick="setFilter('all')">Full plan</button></div><div class="workout-list" style="margin-top:10px">${items.map(w=>`<div class="workout ${w.date===today()?'today-outline':''}"><div class="datebox"><small>${fmtDate(w.date,{month:'short'})}</small><b>${dparse(w.date).getDate()}</b></div><div><div class="type">${w.type}</div><div class="session">${w.session}</div><div class="muted">${targetPace(w)} · ${w.phase}</div></div><div class="km">${w.km?`${w.km}k`:'—'}</div></div>`).join('')}</div>`}
function goLog(date=today()){show('log');renderLog(date)}
function renderLog(date=today()){let w=BASE.plan.find(x=>x.date===date),old=state.logs[date]||{};if(!w){document.querySelector('#log').innerHTML='<div class="empty">No planned workout for this date.</div>';return}document.querySelector('#log').innerHTML=`<div class="section-title"><h2>Log run</h2><span class="muted">${fmtDate(date,{weekday:'short',day:'numeric',month:'short'})}</span></div><div class="card"><div class="type">${w.type}</div><div class="session">${w.session}</div><div class="note">Planned ${w.km} km · ${targetPace(w)}</div></div><div class="formgrid"><div class="field"><label>Actual km</label><input id="actualKm" inputmode="decimal" value="${old.actualKm??''}"></div><div class="field"><label>Actual pace (mm.ss)</label><input id="actualPace" inputmode="decimal" placeholder="6.08" value="${old.actualPace??''}"></div><div class="field"><label>Average HR</label><input id="hr" inputmode="numeric" value="${old.hr??''}"></div><div class="field"><label>RPE (1–10)</label><input id="rpe" type="number" min="1" max="10" value="${old.rpe??''}"></div><div class="field"><label>Legs (1 fresh → 5 very heavy)</label><input id="legs" type="number" min="1" max="5" value="${old.legs??''}"></div><div class="field"><label>Completed?</label><select id="completed"><option></option>${['Yes','Partial','No'].map(x=>`<option ${old.completed===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Notes</label><textarea id="notes" rows="3" placeholder="Heat, hills, sleep, soreness, treadmill…">${old.notes??''}</textarea></div><button class="btn full" onclick="saveLog('${date}')">Save run</button><div class="note">Easy-pace trend qualifies only EASY runs marked Yes, ≥3 km, with pace entered and RPE ≤4.</div>`}
function saveLog(date){let w=BASE.plan.find(x=>x.date===date), ap=document.querySelector('#actualPace').value;if(ap&&paceToSec(ap)==null){toast('Use mm.ss, e.g. 6.08');return}state.logs[date]={type:w.type,actualKm:document.querySelector('#actualKm').value,actualPace:ap,hr:document.querySelector('#hr').value,rpe:document.querySelector('#rpe').value,legs:document.querySelector('#legs').value,completed:document.querySelector('#completed').value,notes:document.querySelector('#notes').value};save();renderHome()}
function renderCalc(){document.querySelector('#calc').innerHTML=`<div class="section-title"><h2>Calculator</h2></div><div class="card"><b>Pace → finish time</b><div class="formgrid" style="margin-top:12px"><div class="field"><label>Pace (mm.ss)</label><input id="cPace" value="6.15" inputmode="decimal" oninput="recalc()"></div><div class="field"><label>Distance km</label><input id="cDist" value="10" inputmode="decimal" oninput="recalc()"></div></div><div class="muted">Finish time</div><div class="calc-result" id="cTime">—</div></div><div class="card"><b>Finish time → pace</b><div class="formgrid" style="margin-top:12px"><div class="field"><label>Finish time (h:mm:ss)</label><input id="cFinish" value="1:00:00" oninput="recalc()"></div><div class="field"><label>Distance km</label><input id="cDist2" value="10" inputmode="decimal" oninput="recalc()"></div></div><div class="muted">Required pace</div><div class="calc-result" id="cReq">—</div></div><div class="card"><b>Race projections at pace</b><div id="projections" style="margin-top:10px"></div></div><div class="note">Pace inputs use mm.ss notation: 6.15 means 6:15/km, not decimal minutes.</div>`;recalc()}
function parseDuration(v){let p=v.split(':').map(Number);if(p.some(Number.isNaN))return null;if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===2)return p[0]*60+p[1];return null}
function recalc(){let p=paceToSec(document.querySelector('#cPace')?.value),d=Number(document.querySelector('#cDist')?.value);document.querySelector('#cTime').textContent=p&&d?dur(p*d):'—';let t=parseDuration(document.querySelector('#cFinish')?.value||''),d2=Number(document.querySelector('#cDist2')?.value);document.querySelector('#cReq').textContent=t&&d2?secToPace(t/d2)+'/km':'—';let races=[['5K',5],['10K',10],['Half',21.0975],['Marathon',42.195],['60K',60]];document.querySelector('#projections').innerHTML=races.map(([n,k])=>`<div class="row"><span>${n}</span><span class="value">${p?dur(p*k):'—'}</span></div>`).join('')}
function renderSettings(){let q=qualifyingEasy(),tr=trend();document.querySelector('#settings').innerHTML=`<div class="section-title"><h2>Easy midpoint checkpoints</h2><span class="muted">Edit only when trend supports</span></div>${BASE.checkpoints.map(([d])=>`<div class="card checkpoint"><div><b>${fmtDate(d,{day:'numeric',month:'short',year:'numeric'})}</b><div class="muted">${d<=today()?'Active / past':'Upcoming checkpoint'}</div></div><input id="cp-${d}" inputmode="decimal" value="${state.checkpoints[d]}"></div>`).join('')}<button class="btn full" onclick="saveCheckpoints()">Save checkpoints</button><div class="card"><b>Recommendation snapshot</b><div class="row"><span>Qualifying easy runs</span><span class="value">${q.length}</span></div><div class="row"><span>28-day trend</span><span class="value">${tr?secToPace(tr)+'/km':'—'}</span></div><div class="note">Prefer at least 3 qualifying runs before considering a change; 5+ gives a more useful trend. Do not rewrite old checkpoints.</div></div><div class="section-title"><h2>Personal backup</h2></div><div class="card"><button class="btn secondary full" onclick="exportData()">Export training data</button><div style="height:8px"></div><label class="btn secondary full" style="display:block;text-align:center">Import training data<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label><div style="height:8px"></div><button class="btn warn full" onclick="clearData()">Reset logs & settings</button><div class="note">Everything is stored only in this browser via localStorage. Export a JSON backup occasionally.</div></div>`}
function saveCheckpoints(){for(let [d] of BASE.checkpoints){let v=document.querySelector('#cp-'+d).value;if(paceToSec(v)==null){toast('Invalid pace at '+d);return}state.checkpoints[d]=Number(v)}save();renderHome();renderPlan();renderSettings()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bintaro60k-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state={...defaults(),...x};save();renderAll()}catch(err){toast('Could not import file')}};r.readAsText(f)}
function clearData(){if(confirm('Reset all personal logs and checkpoint edits?')){state=defaults();save();renderAll()}}
function setFilter(x){state.viewFilter=x;save();renderPlan()}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));if(id==='home')renderHome();if(id==='plan')renderPlan();if(id==='log')renderLog();if(id==='calc')renderCalc();if(id==='settings')renderSettings();window.scrollTo(0,0)}
function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));
function renderAll(){renderHome();renderPlan();renderLog();renderCalc();renderSettings()}
renderAll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshForDateChange()});
window.addEventListener('focus',refreshForDateChange);
setInterval(refreshForDateChange,60000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script></body></html>
